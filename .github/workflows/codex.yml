name: Codex Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: codex-interactive-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  codex:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@codex') && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex') && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@codex') && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@codex') || contains(github.event.issue.title, '@codex')) && contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install protoc
        run: |
          if ! command -v protoc &> /dev/null; then
            brew install protobuf
          fi
          protoc --version

      - name: Setup FVM and Flutter
        run: |
          if [[ "$(uname -m)" != arm64 ]]; then
            echo 'FVM setup requires a macOS ARM64 runner' >&2
            exit 1
          fi
          fvm_dir="$(mktemp -d "${RUNNER_TEMP}/fvm-4.3.1.XXXXXX")"
          curl -fsSL --retry 3 \
            https://github.com/leoafarias/fvm/releases/download/4.3.1/fvm-4.3.1-macos-arm64.tar.gz \
            -o "$fvm_dir/fvm.tar.gz"
          printf '%s  %s\n' \
            9c69d11d792963ce52a2dce457d4ec7f1d9c5da38d17d3088cdfcae4a6e3c525 \
            "$fvm_dir/fvm.tar.gz" | shasum -a 256 -c -
          tar -xzf "$fvm_dir/fvm.tar.gz" -C "$fvm_dir"
          export PATH="$fvm_dir/fvm:$PATH"
          printf '%s\n' "$fvm_dir/fvm" >> "$GITHUB_PATH"
          fvm install 3.41.3
          fvm flutter --version
          fvm dart --version

      - name: Run Codex Code
        uses: Mafbase/Mafbase-workflows/.github/actions/codex-interactive@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ci_workflow: ci-tests.yml
          system_prompt: 'Используй fvm flutter и fvm dart. Flutter 3.41.3 установлен; если .fvmrc требует другую версию, установи её через fvm install <version>.'

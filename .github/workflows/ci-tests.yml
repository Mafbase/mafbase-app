name: CI Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: [self-hosted, linux]
    env:
      GOLDEN_CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Check for golden image changes
        id: golden-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_BRANCH: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_REF="origin/$PR_BASE_BRANCH"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BASE_REF="origin/$DEFAULT_BRANCH"
          else
            BASE_REF="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE_REF" -- 'test/golden/' | grep '\.png$' | grep -v '_ci\.png$' || true)
          if [ -n "$CHANGED" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Golden PNG changes detected:"
            echo "$CHANGED"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No golden PNG changes detected, skipping regeneration"
          fi

      - name: Setup FVM and Flutter
        run: |
          if [[ "$(uname -m)" != x86_64 ]]; then
            echo 'FVM setup requires a Linux x64 runner' >&2
            exit 1
          fi
          fvm_dir="$(mktemp -d "${RUNNER_TEMP}/fvm-4.3.1.XXXXXX")"
          curl -fsSL --retry 3 \
            https://github.com/leoafarias/fvm/releases/download/4.3.1/fvm-4.3.1-linux-x64.tar.gz \
            -o "$fvm_dir/fvm.tar.gz"
          printf '%s  %s\n' \
            ad59c861bdbef80c9f262d30ab28debd374afad0ef4b10b99a47bbab77e08bde \
            "$fvm_dir/fvm.tar.gz" | sha256sum -c -
          tar -xzf "$fvm_dir/fvm.tar.gz" -C "$fvm_dir"
          export PATH="$fvm_dir/fvm:$PATH"
          printf '%s\n' "$fvm_dir/fvm" >> "$GITHUB_PATH"
          fvm install 3.41.3
          fvm flutter --version
          fvm dart --version

      - name: Install dependencies
        run: fvm flutter pub get

      - name: Generate localizations
        run: fvm flutter gen-l10n

      - name: Generate code
        run: fvm dart run build_runner build --delete-conflicting-outputs

      - name: Update CI golden images
        if: steps.golden-check.outputs.has_changes == 'true'
        run: fvm flutter test --update-goldens test/golden/

      - name: Verify only CI golden images changed
        if: steps.golden-check.outputs.has_changes == 'true'
        run: |
          CHANGED=$(git diff --name-only)
          UNTRACKED=$(git ls-files --others --exclude-standard)
          ALL_CHANGES=$(printf '%s\n%s' "$CHANGED" "$UNTRACKED" | sed '/^$/d')

          if [ -z "$ALL_CHANGES" ]; then
            echo "No golden changes detected"
            exit 0
          fi

          UNEXPECTED=$(echo "$ALL_CHANGES" | grep -v '_ci\.png$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected files were modified by --update-goldens:"
            echo "$UNEXPECTED"
            exit 1
          fi

          echo "Only CI golden images changed (as expected):"
          echo "$ALL_CHANGES"

      - name: Commit and push updated goldens
        if: steps.golden-check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test/golden/goldens/*_ci.png
          git diff --cached --quiet || git commit -m "chore: update CI golden images"
          git push

      - name: Run tests
        run: fvm flutter test

error_log /dev/stdout error;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  # mime.types in nginx 1.21 has no mjs; a second types block in the same context extends the list.
  types {
    application/javascript mjs;
  }
  default_type  application/octet-stream;

  sendfile on;

  # .gz copies are produced in the Dockerfile build stage.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/manifest+json application/wasm image/svg+xml;

  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # These files must never be cached by the browser.
    # Flutter's service worker updates automatically when
    # flutter_service_worker.js changes between deployments —
    # but only if the browser can always fetch the latest version.
    location ~* ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|manifest\.json)$ {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      add_header Pragma "no-cache";
      expires 0;
    }

    # Part files and wasm modules are numbered, so after a deploy the same URL may hold different code.
    location ~ ^/main\.dart(\.js|\.mjs|\.wasm|_module\d+\.wasm|\.js_\d+\.part\.js)(\.map)?$ {
      add_header Cache-Control "no-cache";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
